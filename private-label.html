<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Label — Interlock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f6f0;color:#000;font:500 16px Geist,Arial,sans-serif}
main{position:relative;height:100dvh;overflow:hidden}
.brand{position:absolute;top:clamp(19px,8vh,58px);left:4.5%;font-size:clamp(43px,8vw,94px);line-height:.84;letter-spacing:-.09em}
.brand span{margin-left:.4em}
.heading{position:absolute;left:12px;top:54%;font-size:24px;letter-spacing:-.045em}
.heading::after{content:"";position:absolute;left:-12px;top:29px;border-top:1px dashed;width:calc(100% + 12px);pointer-events:none}
button{font:inherit;background:none;border:0;color:inherit;cursor:pointer}
.replay{padding:3px 8px 6px 0;font-size:32px;line-height:1}
figure{position:absolute;left:16%;top:43%;width:clamp(100px,12vw,146px);margin:0}
.art{position:relative}
canvas{display:block;width:100%;height:auto}
.ink{position:absolute;inset:0}
.caption{margin-top:2px}
footer{position:absolute;right:4%;bottom:12px;line-height:.95;letter-spacing:-.04em}
footer span{display:block;margin-left:.4em}
footer small{display:block;margin-left:.55em}
@media(max-width:600px){figure{left:50%;translate:-50% 0;top:61%;width:min(30vw,15dvh)}}
.art{overflow:visible;isolation:isolate;background:#07090f;filter:invert(1)}
.art canvas{filter:brightness(0) invert(1)}
.art .ink{mix-blend-mode:difference;z-index:2}
.art .impression{position:relative;inset:auto;opacity:1}
.art .ink,.art .impression{will-change:transform}
@media(prefers-reduced-motion:no-preference){
.play .impression{animation:interlock-p 1.52s cubic-bezier(.41,.23,.25,1) both}
.play .ink{animation:interlock-l 1.46s cubic-bezier(.41,.23,.25,1) .12s both}
.play .caption{animation:interlock-name .42s ease-out 1.74s both}
}
@keyframes interlock-p{0%{opacity:0;transform:translate(clamp(130px,18vw,200px),-9px)}12%{opacity:0}42%{opacity:1}to{opacity:1;transform:translate(0,0)}}
@keyframes interlock-l{0%{opacity:0;transform:translate(clamp(-190px,-17vw,-125px),12px)}12%{opacity:0}42%{opacity:1}to{opacity:1;transform:translate(0,0)}}
@keyframes interlock-name{from{opacity:0}to{opacity:1}}

.art{background:none;filter:none;isolation:auto}
.art canvas{filter:none}
.art .impression,.art .ink{visibility:hidden;animation:none!important}
.art .composite{position:absolute;top:-100%;left:-350%;width:800%;max-width:none;pointer-events:none}
body{background:transparent}
figure{left:calc(49% + min(5.4vw,11dvh,72.5px));top:11%;translate:-50% 0;width:min(5.4vw,11dvh,72.5px)}
@media(max-width:600px){figure{left:68%;top:28%;width:min(12vw,7.5dvh);translate:-50% 0}}
.play .caption{animation:none!important}</style>
<main><figure aria-label="Private Label">
<div class="art"><canvas class="impression" aria-hidden="true"></canvas><canvas class="ink" aria-hidden="true"></canvas></div>
<canvas class="caption" aria-hidden="true"></canvas>
</figure>

</main>
<script>
const logo=new Image();
const figure=document.querySelector('figure');
let motion;
let captionMotion;
function replay(){const p=document.querySelector('.impression'),l=document.querySelector('.ink'),caption=document.querySelector('.caption');if(!p.dataset.ready)return;if(p.getBoundingClientRect().width<=0){cancelAnimationFrame(motion);motion=requestAnimationFrame(replay);return}cancelAnimationFrame(motion);captionMotion?.cancel();caption.style.opacity='0';figure.classList.remove('play');void figure.offsetWidth;figure.classList.add('play');let view=document.querySelector('.composite');if(!view){view=document.createElement('canvas');view.className='composite';p.parentElement.append(view)}view.width=p.width*8;const insetY=p.height;view.height=p.height+2*insetY;const ctx=view.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,origin=p.width*3.5,units=p.width/p.getBoundingClientRect().width;const clamp=t=>Math.max(0,Math.min(1,t)),smooth=t=>t*t*(3-2*t);const maxVertical=p.height*.78;const starts=[{image:p,x:(105+Math.random()*70)*units,y:(Math.random()*2-1)*maxVertical},{image:l,x:-(105+Math.random()*70)*units,y:(Math.random()*2-1)*maxVertical}].map((s,index)=>({...s,index,delay:Math.random()*130,duration:1750+Math.random()*350}));document.documentElement.dataset.entryDirections='P:right; L:left; straight';const finish=Math.max(...starts.map(s=>s.delay+s.duration)),start=performance.now();function draw(now){const elapsed=reduced?finish:now-start;ctx.clearRect(0,0,view.width,view.height);for(const entry of starts){const t=clamp((elapsed-entry.delay)/entry.duration),remaining=1-smooth(t);ctx.globalCompositeOperation=entry.index===0?'source-over':'xor';ctx.globalAlpha=smooth(clamp((t-.06)/.48));ctx.drawImage(entry.image,origin+entry.x*remaining,insetY+entry.y*remaining)}ctx.globalAlpha=1;if(elapsed<finish)motion=requestAnimationFrame(draw);else captionMotion=caption.animate([{opacity:0},{opacity:1}],{duration:reduced?0:620,delay:reduced?0:750,easing:'ease',fill:'both'})}draw(start)}
window.addEventListener('message',event=>{if((event.origin===location.origin||location.protocol==='file:')&&event.data==='play-private-label') replay();});
logo.onload=()=>{
 const source=document.createElement('canvas');
 const width=source.width=logo.naturalWidth;
 const height=source.height=logo.naturalHeight;
 const ctx=source.getContext('2d');
 ctx.drawImage(logo,0,0);
 const data=ctx.getImageData(0,0,width,height);
 const opacity=new Uint8ClampedArray(width*height);
 for(let i=0;i<opacity.length;i++) opacity[i]=(data.data[i*4]-data.data[i*4+2])*255/235;
 for(let y=0;y<height;y++) for(let x=0;x<width;x++){
  const i=y*width+x, p=i*4;
  const radius=y<height*.89?2:1;
  const edge=Math.min(opacity[i],opacity[i-radius]??0,opacity[i+radius]??0,opacity[i-width*radius]??0,opacity[i+width*radius]??0);
  data.data[p]=data.data[p+1]=data.data[p+2]=0;
  data.data[p+3]=opacity[i]*.2+edge*.8;
 }
 ctx.putImageData(data,0,0);
 const split=Math.round(height*.89);
 const owner=new Int32Array(width*split);
 const regions=[];
 for(let i=0;i<owner.length;i++){
  if(owner[i] || data.data[i*4+3]<170) continue;
  const id=regions.length+1;
  const queue=[i];
  owner[i]=id;
  let left=width;
  for(let j=0;j<queue.length;j++){
   const k=queue[j],x=k%width,y=Math.floor(k/width);
   left=Math.min(left,x);
   for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(x+dx<0||x+dx>=width||y+dy<0||y+dy>=split) continue;
    const n=k+dy*width+dx;
    if(!owner[n]&&data.data[n*4+3]>=170){owner[n]=id;queue.push(n);}
   }
  }
  regions.push({id,left,size:queue.length});
 }
 const letters=regions.sort((a,b)=>b.size-a.size).slice(0,2).sort((a,b)=>a.left-b.left);
 const separated=letters.length===2 && letters[1].size>width;
 const pShape=letters[0]?.id;
 for(const [selector,top,length] of [['.ink',0,split],['.impression',0,split],['.caption',split,height-split]]){
  const canvas=document.querySelector(selector);
  canvas.width=width;
  canvas.height=length;
  const paint=canvas.getContext('2d');
  paint.drawImage(source,0,top,width,length,0,0,width,length);
  if(selector!=='.caption'){
   const layer=paint.getImageData(0,0,width,length);
   for(let y=0;y<length;y++) for(let x=0;x<width;x++){
    const u=x/width,v=y/height;
    const letter=owner[y*width+x] || owner[y*width+x-1] || owner[y*width+x+1] || owner[(y-1)*width+x] || owner[(y+1)*width+x];
    const innerHook=v>=.326 && v<.429 && u>=.465;
    const isP=innerHook || (separated&&letter?letter===pShape:
     v<.30 || (u<.28&&v<.67) || (u>.465&&v<.429));
    if(isP!==(selector==='.impression')) layer.data[(y*width+x)*4+3]=0;
    else{
     const alpha=(y*width+x)*4+3;
     layer.data[alpha]=Math.max(0,Math.min(255,(layer.data[alpha]-22)*1.16));
    }
   }
   if(selector==='.impression'){
    const visited=new Uint8Array(width*length);
    let main=[];
    for(let start=0;start<visited.length;start++){
     if(visited[start]||!layer.data[start*4+3]) continue;
     const group=[start];
     visited[start]=1;
     for(let j=0;j<group.length;j++){
      const point=group[j],x=point%width,y=Math.floor(point/width);
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
       if(x+dx<0||x+dx>=width||y+dy<0||y+dy>=length) continue;
       const next=point+dx+dy*width;
       if(!visited[next]&&layer.data[next*4+3]){
        visited[next]=1;
        group.push(next);
       }
      }
     }
     if(group.length>main.length) main=group;
    }
    for(const point of main) visited[point]=2;
    for(let i=0;i<visited.length;i++) if(visited[i]!==2) layer.data[i*4+3]=0;
   }
   paint.putImageData(layer,0,0);
  }
 }
 document.querySelector('.impression').dataset.ready="true";
 replay();
};
